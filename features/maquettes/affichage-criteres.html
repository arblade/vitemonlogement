<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maquette : critères sur la carte et la fiche</title>
<style>
:root{--ink:#222;--stone:#6a6a6a;--line:#ddd;--line-soft:#ebebeb;--sage:#f7f7f7;--mist:#fafafa;--brand:#ff385c;--brand-wash:#fff1f3;--brand-deep:#c13515;--ok:#0f7b3f;--ok-wash:#eaf7ee;--ok-line:#b5e0c3;--ok-deep:#0b5d2f}
*{box-sizing:border-box}body{margin:0;font-family:Figtree,Inter,system-ui,sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.45}
svg.lucide{width:1.15em;height:1.15em;stroke-width:1.7;flex:none}
.photo{background:linear-gradient(135deg,#d9d4cc,#bdb6aa);border-radius:16px;position:relative;min-height:200px;display:grid;place-items:center;color:#8a8478;font-size:12px}
.card{border:1px solid var(--line);border-radius:24px;overflow:hidden;background:#fff;margin:16px}
.card .body{padding:16px}
.card h3{margin:0;font-size:18px;font-weight:600;letter-spacing:-.02em}
.gen{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:10px;overflow:hidden;margin-top:14px}
.gen div{background:var(--sage);padding:8px 10px;min-width:0}.gen b{display:block;font-size:12px;color:var(--stone);font-weight:500}.gen span{font-weight:600;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.chip.ok{background:var(--ok-wash);border-color:var(--ok-line);color:var(--ok-deep);font-weight:600}
.chip.unk{background:#fff;border:1px dashed #b0b0b0;color:var(--stone)}
.chip.more{border:0;color:var(--stone);padding:6px 4px}
.why{margin-top:14px;background:var(--sage);border-radius:10px;padding:10px 12px;font-size:13px}
.why small{display:flex;gap:6px;align-items:center;color:var(--brand-deep);text-transform:uppercase;letter-spacing:.08em;font-size:12px;margin-bottom:4px}
.btn{display:block;margin-top:14px;text-align:center;background:var(--brand);color:#fff;border-radius:10px;padding:11px;font-weight:600;font-size:13px}
.tag{font-size:12px;color:var(--stone);margin:16px 16px 0;text-transform:uppercase;letter-spacing:.08em}
/* fiche */
.fiche{padding:0 20px 28px}.fiche h1{font-size:28px;letter-spacing:-.03em;line-height:1.1;margin:14px 0 4px}
.loc{color:var(--stone);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-top:18px}
h2{font-size:20px;letter-spacing:-.02em;margin:0 0 12px;font-weight:600}
section{border-top:1px solid var(--line-soft);padding:22px 0}
.ess{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.ess div{background:var(--mist);border-radius:12px;padding:12px}.ess b{display:block;color:var(--stone);font-size:12px;font-weight:500}.ess span{font-weight:600}
.grp{margin-top:18px}.grp h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--stone);margin:0 0 8px;font-weight:600}
.feat{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr;gap:0 28px}
.feat li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px}.feat svg{width:22px;height:22px;flex:none}
.feat em{font-style:normal;color:var(--stone);font-size:12px;margin-left:auto;padding-left:8px}
.aside{background:var(--sage);border-radius:16px;padding:18px}.aside h2{font-size:24px}
.quote{border-left:2px solid var(--brand);padding-left:10px;font-size:12px;color:#484848;margin-top:10px}
.crit{display:flex;flex-wrap:wrap;gap:8px}
.crit .chip{font-size:13px;padding:8px 13px}
@media(min-width:900px){
 .card{display:grid;grid-template-columns:310px 1fr;max-width:980px}.card .photo{margin:12px;min-height:260px}.card .body{padding:20px 22px}.gen{grid-template-columns:repeat(4,1fr)}
 .fiche{padding:0 40px 40px;max-width:1100px;margin:0 auto}.fiche h1{font-size:44px}.cols{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:40px}.feat{grid-template-columns:1fr 1fr}.ess{grid-template-columns:repeat(4,1fr)}}
.note{margin:0 16px;padding:12px 14px;border:1px dashed var(--brand);background:var(--brand-wash);border-radius:12px;font-size:12px;color:#5b2a1d}
@media(min-width:900px){.note{max-width:980px}}
</style></head><body>
<div id="app"></div>
<script>
const ICONS={"check":"<path d=\"M20 6 9 17l-5-5\"/>","circle-help":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/>","sun":"<circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"M12 2v2\"/><path d=\"M12 20v2\"/><path d=\"m4.93 4.93 1.41 1.41\"/><path d=\"m17.66 17.66 1.41 1.41\"/><path d=\"M2 12h2\"/><path d=\"M20 12h2\"/><path d=\"m6.34 17.66-1.41 1.41\"/><path d=\"m19.07 4.93-1.41 1.41\"/>","eye":"<path d=\"M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0\"/><circle cx=\"12\" cy=\"12\" r=\"3\"/>","building-2":"<path d=\"M10 12h4\"/><path d=\"M10 8h4\"/><path d=\"M14 21v-3a2 2 0 0 0-4 0v3\"/><path d=\"M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2\"/><path d=\"M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16\"/>","arrow-up-down":"<path d=\"m21 16-4 4-4-4\"/><path d=\"M17 20V4\"/><path d=\"m3 8 4-4 4 4\"/><path d=\"M7 4v16\"/>","layers":"<path d=\"M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z\"/><path d=\"M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12\"/><path d=\"M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17\"/>","landmark":"<path d=\"M10 18v-7\"/><path d=\"M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949z\"/><path d=\"M14 18v-7\"/><path d=\"M18 18v-7\"/><path d=\"M3 22h18\"/><path d=\"M6 18v-7\"/>","sparkles":"<path d=\"M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z\"/><path d=\"M20 2v4\"/><path d=\"M22 4h-4\"/><circle cx=\"4\" cy=\"20\" r=\"2\"/>","bike":"<circle cx=\"18.5\" cy=\"17.5\" r=\"3.5\"/><circle cx=\"5.5\" cy=\"17.5\" r=\"3.5\"/><circle cx=\"15\" cy=\"5\" r=\"1\"/><path d=\"M12 17.5V14l-3-3 4-3 2 3h2\"/>","warehouse":"<path d=\"M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11\"/><path d=\"M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z\"/><path d=\"M6 13h12\"/><path d=\"M6 17h12\"/>","cooking-pot":"<path d=\"M2 12h20\"/><path d=\"M20 12v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8\"/><path d=\"m4 8 16-4\"/><path d=\"m8.86 6.78-.45-1.81a2 2 0 0 1 1.45-2.43l1.94-.48a2 2 0 0 1 2.43 1.46l.45 1.8\"/>","shirt":"<path d=\"M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z\"/>","lightbulb":"<path d=\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\"/><path d=\"M9 18h6\"/><path d=\"M10 22h4\"/>","ruler":"<path d=\"M21.3 15.3a2.4 2.4 0 0 1 0 3.4l-2.6 2.6a2.4 2.4 0 0 1-3.4 0L2.7 8.7a2.41 2.41 0 0 1 0-3.4l2.6-2.6a2.41 2.41 0 0 1 3.4 0Z\"/><path d=\"m14.5 12.5 2-2\"/><path d=\"m11.5 9.5 2-2\"/><path d=\"m8.5 6.5 2-2\"/><path d=\"m17.5 15.5 2-2\"/>","sofa":"<path d=\"M20 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v3\"/><path d=\"M2 16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5a2 2 0 0 0-4 0v1.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5V11a2 2 0 0 0-4 0z\"/><path d=\"M4 18v2\"/><path d=\"M20 18v2\"/><path d=\"M12 4v9\"/>","receipt":"<path d=\"M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z\"/><path d=\"M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8\"/><path d=\"M12 17.5v-11\"/>"};
const view=new URLSearchParams(location.search).get('v')||'card';
const I=(n)=>`<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.check}</svg>`;
const chip=(t,k,icon)=>`<li class="chip ${k}">${I(icon)}${t}</li>`;
const gen=`<div class="gen"><div><b>Prix</b><span>1 390 €</span></div><div><b>Surface</b><span>71 m²</span></div><div><b>Pièces</b><span>3 pièces</span></div><div><b>Localisation</b><span>Lyon 1er</span></div></div>`;
const criteria=[['Terrasse ou balcon','ok','check'],['Ascenseur','ok','check'],['Lumineux','ok','check'],['Calme','unk','circle-help'],['Proche métro','unk','circle-help']];
function card(label,chips,more,note){return `<p class="tag">${label}</p><article class="card"><div class="photo">photo</div><div class="body"><h3>Duplex 3 pièces 71 m²</h3>${gen}<ul class="chips">${chips}${more?`<li class="chip more">+${more}</li>`:''}</ul><div class="why"><small>${I('sparkles')} Pourquoi ce logement ?</small>Duplex en dernier étage avec ascenseur, terrasse de 10 m² plein sud et vue sur Fourvière.</div><a class="btn">Lire le détail</a></div></article>${note?`<p class="note">${note}</p>`:''}`}
if(view==='card'){
 document.getElementById('app').innerHTML=
 card('Carte · avec une demande (5 critères)',criteria.map(c=>chip(...c)).join('')+chip('Vue dégagée','','eye'),4,'Critères de l’utilisateur d’abord. « Calme » et « Proche métro » sont demandés mais non trouvés : seulement alors « à vérifier ». Il reste 1 place : le meilleur atout confirmé.')+
 card('Carte · sans critère précis',[['Terrasse 10 m²','sun'],['Vue dégagée','eye'],['Dernier étage','building-2'],['Ascenseur','arrow-up-down'],['Duplex','layers'],['Cachet','landmark']].map(([t,i])=>chip(t,'',i)).join(''),5,'Pas de critère : 6 atouts confirmés par l’annonce. Rien sur les animaux, Visale, APL… : l’annonce n’en parle pas, donc rien ne s’affiche.');
}else{
 const f=(t,i,e)=>`<li>${I(i)}<span>${t}</span>${e?`<em>${e}</em>`:''}</li>`;
 document.getElementById('app').innerHTML=`<div class="fiche"><div class="photo" style="min-height:260px;margin:0 -20px;border-radius:0">galerie</div>
 <div class="loc">Lyon 1er · Sathonay</div><h1>Duplex 3 pièces 71 m²</h1>
 <section><h2>L’essentiel</h2><div class="ess"><div><b>Prix</b><span>1 390 €</span></div><div><b>Surface</b><span>71 m²</span></div><div><b>Pièces</b><span>3 pièces</span></div><div><b>Localisation</b><span>Lyon 1er</span></div></div></section>
 <div class="cols"><div>
 <section><h2>Votre demande, point par point</h2><ul class="crit" style="padding:0;margin:0;list-style:none">${criteria.map(c=>chip(...c)).join('')}</ul></section>
 <section><h2>Caractéristiques</h2>
  <div class="grp" style="margin-top:0"><h3>Extérieur et annexes</h3><ul class="feat">${f('Terrasse de 10 m², plein sud','sun')}${f('Vue sur Fourvière et le val de Saône','eye')}${f("Local à vélos en rez-de-chaussée","warehouse")}${f('Cave','warehouse')}</ul></div>
  <div class="grp"><h3>Intérieur</h3><ul class="feat">${f('Duplex avec mezzanine','layers')}${f('Cuisine équipée','cooking-pot')}${f('Buanderie','shirt')}${f('Lumineux','lightbulb')}${f('Cachet, immeuble de 1870','landmark')}${f('Plutôt spacieux','ruler','calculé : 24 m² par pièce')}</ul></div>
  <div class="grp"><h3>Immeuble</h3><ul class="feat">${f('Ascenseur','arrow-up-down')}${f('6e étage sur 6, dernier étage','building-2')}</ul></div>
  <div class="grp"><h3>Conditions</h3><ul class="feat">${f('Meublé','sofa')}${f('Charges comprises','receipt')}</ul></div>
 </section>
 <section><h2>L’annonce, dans ses mots.</h2><p style="color:#484848;line-height:1.8;margin:0">Situé au 11 rue Bouteille, proche Place Sathonay, en dernier étage avec ascenseur, appartement en duplex très charmant. Terrasse plein ciel de 10 m² avec superbe vue sur Fourvière…</p></section>
 </div><aside><div class="aside"><small style="color:var(--brand-deep);text-transform:uppercase;letter-spacing:.1em;font-size:12px;display:flex;gap:6px;align-items:center">${I('sparkles')} Lecture complémentaire</small><h2 style="margin-top:12px">Pourquoi ce logement ?</h2><p style="margin:0;font-size:14px;line-height:1.7">Duplex en dernier étage avec ascenseur, terrasse de 10 m² plein sud et vue sur Fourvière. Meublé, charges comprises.</p><div class="quote">« Terrasse plein ciel de 10 m2 avec superbe vue sur Fourvière »</div></div></aside></div></div>`;
}
</script></body></html>
