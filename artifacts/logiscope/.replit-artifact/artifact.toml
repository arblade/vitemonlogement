kind = "web"
previewPath = "/"
title = "Logiscope"
description = "Recherche de logements à partir d’une demande en langage naturel, annonces Le Bon Coin via Apify, analyse IA avec provenance des informations et historique local SQLite."
version = "1.0.0"
id = "artifacts/logiscope"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21140

[services.development]
run = "pnpm --filter @workspace/logiscope run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/logiscope", "run", "build" ]
serve = "static"
publicDir = "artifacts/logiscope/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21140"
BASE_PATH = "/"
