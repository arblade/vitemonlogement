# Blueprint Render : un seul service web sert l'API (/api), le worker de recherches et le front compilé.
# La base Postgres (Neon) existe déjà : collez sa chaîne de connexion dans DATABASE_URL.
# Le worker tourne dans ce même processus : il faut un plan payant (pas de mise en veille) pour que
# les recherches avancent même quand personne n'a l'application ouverte.
services:
  - type: web
    name: vitemonlogement
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @workspace/logiscope run build && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.2
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Facultatif : temps et tracés de trajet (Google Routes API). Sans elle, la carte s'affiche sans durée.
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # E-mails de la veille quotidienne (Resend). Sans clé : rien ne part, le site fonctionne pareil.
      - key: RESEND_API_KEY
        sync: false
      # Facultatif : reçoit une alerte quand une veille échoue 3 relèves d'affilée.
      - key: ALERT_EMAIL
        sync: false
      # Facultatif : adresse du site dans les liens des e-mails (par défaut l'adresse onrender.com fournie par Render).
      # À poser à https://vitemonlogement.fr quand le domaine pointera sur Render.
      - key: PUBLIC_URL
        sync: false
      # Lecture des annonces par Jev (TypeSafe) : ANALYSIS_ENGINE=jev + JEV_API_KEY ; sans elles, le LLM seul.
      - key: ANALYSIS_ENGINE
        sync: false
      - key: JEV_API_KEY
        sync: false
      # Facultatifs : expéditeur et adresse de réponse des e-mails (défaut : alertes@vitemonlogement.fr).
      - key: MAIL_FROM
        sync: false
      - key: MAIL_REPLY_TO
        sync: false
