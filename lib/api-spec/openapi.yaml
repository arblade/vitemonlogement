openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API Logiscope
servers:
  - url: /api
tags:
  - name: health
  - name: housing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /housing/interpret:
    post:
      operationId: interpretHousingRequest
      tags: [housing]
      summary: Interpret a French natural-language housing request into editable criteria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingPrompt"
      responses:
        "200":
          description: Interpreted criteria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingCriteria"
  /housing/searches:
    get:
      operationId: listHousingSearches
      tags: [housing]
      responses:
        "200":
          description: Recent searches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HousingSearchSummary"
    post:
      operationId: createHousingSearch
      tags: [housing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HousingSearchInput"
      responses:
        "201":
          description: Search started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchDetail"
  /housing/searches/{id}:
    get:
      operationId: getHousingSearch
      tags: [housing]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Search and listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchDetail"
  /housing/searches/{id}/analyze:
    post:
      operationId: analyzeHousingSearch
      tags: [housing]
      summary: Ask the AI analysis of listings now displayed (and the next ones), done in the background
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "202":
          description: Analysis requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchDetail"
  /housing/searches/{id}/refresh:
    post:
      operationId: refreshHousingSearch
      tags: [housing]
      summary: Read the next, older page of ads (« Étendre »), merged without duplicates
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "202":
          description: Reading started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchDetail"
  /housing/searches/{id}/watch:
    put:
      operationId: watchHousingSearch
      tags: [housing]
      summary: Follow this search (one per account, replaces the previous one) at the given Paris times
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchInput"
      responses:
        "200":
          description: Search followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchSummary"
    delete:
      operationId: unwatchHousingSearch
      tags: [housing]
      summary: Stop following this search
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Search no longer followed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingSearchSummary"
  /housing/searches/{id}/visit:
    post:
      operationId: visitHousingSearch
      tags: [housing]
      summary: The owner opened the search; its new listings now count as seen
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Visit recorded
  /housing/watch:
    get:
      operationId: getWatchedSearch
      tags: [housing]
      summary: The followed search of the account (badges of the site)
      responses:
        "200":
          description: Followed search, if any
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchStatus"
  /housing/searches/{id}/listings/{listingId}/routes:
    get:
      operationId: getListingRoutes
      tags: [housing]
      summary: Travel routes from a listing to each geocoded place of the search (only when routing is configured)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: path
          name: listingId
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: One or several entries per place that could be reached (see ListingRoute)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingRoutes"
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    HousingPrompt:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 10, maxLength: 1000 }
    HousingCriteria:
      type: object
      required: [location, intent, keywords]
      properties:
        location: { type: string }
        intent: { type: string, enum: [rent, buy] }
        minPrice: { type: ["integer", "null"] }
        maxPrice: { type: ["integer", "null"] }
        minArea: { type: ["integer", "null"] }
        maxArea: { type: ["integer", "null"] }
        minRooms: { type: ["integer", "null"] }
        maxRooms: { type: ["integer", "null"] }
        radius: { type: integer, minimum: 0, maximum: 200 }
        keywords: { type: string }
        propertyType:
          description: Dwelling type wanted (house or apartment); null or absent = both
          type: ["string", "null"]
          enum: [house, apartment, null]
        wishes:
          type: array
          items: { type: string }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HousingCriterion"
        places:
          type: array
          items:
            $ref: "#/components/schemas/HousingPlace"
    HousingPlace:
      type: object
      required: [id, label, kind, address]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, enum: [work, school, other] }
        address: { type: string }
        mode:
          description: Travel mode stated explicitly by the user (wins over the automatic choice)
          type: ["string", "null"]
          enum: [transit, drive, bike, walk, null]
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        resolved: { type: ["string", "null"] }
    TravelMode:
      type: string
      enum: [transit, drive, bike, walk]
    ListingRoutes:
      type: object
      required: [routes]
      properties:
        routes:
          type: array
          items:
            $ref: "#/components/schemas/ListingRoute"
    ListingRoute:
      description: >
        Walk alone when ≤ 20 min; otherwise one entry per available mode among bike, transit and drive.
        Exactly one entry per place is recommended: the mode stated by the user, else bike ≤ 40 min, else transit if any, else drive.
      type: object
      required: [placeId, mode, recommended, durationSeconds, distanceMeters, path, segments]
      properties:
        placeId: { type: string }
        mode: { $ref: "#/components/schemas/TravelMode" }
        recommended: { type: boolean }
        durationSeconds: { type: integer }
        distanceMeters: { type: integer }
        path:
          type: array
          items:
            type: array
            items: { type: number }
        segments:
          description: Transit only — walking parts and each line ridden, in order; empty for other modes
          type: array
          items:
            $ref: "#/components/schemas/RouteSegment"
    RouteSegment:
      type: object
      required: [mode, path, line]
      properties:
        mode: { $ref: "#/components/schemas/TravelMode" }
        path:
          type: array
          items:
            type: array
            items: { type: number }
        line:
          oneOf:
            - type: "null"
            - type: object
              required: [name, color, vehicle]
              properties:
                name: { type: string }
                color: { type: ["string", "null"] }
                vehicle: { type: ["string", "null"], description: "Google vehicle type: SUBWAY, TRAM, BUS, RAIL…" }
    HousingCriterion:
      type: object
      required: [id, label, availability]
      properties:
        id: { type: string }
        label: { type: string }
        availability: { type: string, enum: [api, hybrid, description] }
        apiField: { type: ["string", "null"] }
    HousingSearchInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 10, maxLength: 1000 }
        watchFrom:
          description: Search whose daily watch moves to this new search (same times), when the user edits a watched search
          type: integer
    AnalysisRequest:
      type: object
      required: [listingIds]
      properties:
        listingIds:
          type: array
          maxItems: 50
          items: { type: integer }
    WatchInput:
      type: object
      required: [times]
      properties:
        times:
          description: Paris times, « HH:MM »
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
    WatchStatus:
      type: object
      required: [search]
      properties:
        search:
          oneOf:
            - $ref: "#/components/schemas/HousingSearchSummary"
            - type: "null"
    HousingSearchSummary:
      type: object
      required: [id, prompt, criteria, status, count, createdAt, analyzed, task, watch, watchTimes, unseenCount]
      properties:
        id: { type: integer }
        prompt: { type: string }
        criteria:
          $ref: "#/components/schemas/HousingCriteria"
        status: { type: string, enum: [running, completed, failed] }
        stage: { type: string, enum: [interpreting, searching, analyzing, ready, failed] }
        phase: { type: string, enum: [focused, broad] }
        searchRequests:
          type: array
          items:
            $ref: "#/components/schemas/HousingSearchRequest"
        focusedMatches: { type: ["integer", "null"] }
        count: { type: integer }
        createdAt: { type: string }
        analyzed: { type: boolean }
        error: { type: ["string", "null"] }
        task:
          description: Background work on a completed search
          type: ["string", "null"]
          enum: [watch, backfill, extend, analyze, null]
        watch:
          description: Followed search (« active »), paused for lack of visits (« paused »), or not followed
          type: ["string", "null"]
          enum: [active, paused, null]
        watchTimes:
          type: array
          items: { type: string }
        nextWatchAt: { type: ["string", "null"] }
        lastVisitedAt: { type: ["string", "null"] }
        lastWatchAt:
          description: Start of the last pass of the followed search (its listings are separated from older ones)
          type: ["string", "null"]
        lastWatchStatus:
          description: Outcome of the last pass — ok, partial (page cap reached or a later page failed, listings may have been missed) or failed (nothing read)
          type: ["string", "null"]
          enum: [ok, partial, failed, null]
        readProgress:
          description: Reading in progress (page being read, maximum pages for this pass), null when nothing is being read
          oneOf:
            - $ref: "#/components/schemas/ReadProgress"
            - type: "null"
        unseenCount:
          description: Listings of the followed search found since the last visit
          type: integer
    ReadProgress:
      type: object
      required: [page, maxPages]
      properties:
        page: { type: integer }
        maxPages: { type: integer }
    HousingSearchRequest:
      type: object
      required: [batch, path, input]
      properties:
        batch: { type: string, enum: [focused, broad] }
        source: { type: string, enum: [leboncoin, pap, seloger] }
        path: { type: string }
        input: { type: string }
    HousingFeature:
      type: object
      required: [label, value, source, evidence]
      properties:
        label: { type: string }
        value: { type: string }
        source: { type: string, enum: [annonce, ia] }
        evidence: { type: string }
    HousingCriterionResult:
      type: object
      required: [id, label, status, source, value, evidence]
      properties:
        id: { type: string }
        label: { type: string }
        status: { type: string, enum: [confirmed, contradicted, unknown] }
        source: { type: string, enum: [api, description, unknown] }
        value: { type: string }
        evidence: { type: string }
    HousingListing:
      type: object
      required: [id, source, batch, title, url, description, features, criterionResults, score, images, aiSummary, summaryEvidence, analyzed]
      properties:
        id: { type: integer }
        source:
          description: Site the listing comes from
          type: string
          enum: [leboncoin, pap, seloger]
        batch: { type: string, enum: [focused, broad] }
        title: { type: string }
        url: { type: string }
        description: { type: string }
        price: { type: ["number", "null"] }
        area: { type: ["number", "null"] }
        rooms: { type: ["integer", "null"] }
        location: { type: ["string", "null"] }
        image: { type: ["string", "null"] }
        images:
          type: array
          items: { type: string }
        aiSummary: { type: ["string", "null"] }
        summaryEvidence:
          type: array
          items: { type: string }
        score: { type: integer }
        features:
          type: array
          items:
            $ref: "#/components/schemas/HousingFeature"
        criterionResults:
          type: array
          items:
            $ref: "#/components/schemas/HousingCriterionResult"
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        geoPrecision:
          type: ["string", "null"]
          enum: [streetNumber, street, district, city, null]
        geoSource:
          description: "description = position found in the listing text (cited address, geocoded), not given by the site"
          type: ["string", "null"]
          enum: [description, null]
        geoEvidence:
          description: Exact sentence of the listing that cites the address (when geoSource is description)
          type: ["string", "null"]
        postedAt:
          description: Publication on the site (ISO)
          type: ["string", "null"]
        refreshedAt:
          description: Last update on the site, moves when the ad is bumped (ISO)
          type: ["string", "null"]
        firstSeenAt:
          description: First read for this search (ISO)
          type: ["string", "null"]
        analyzed:
          description: false while the AI analysis is still to be done (done when the listing is displayed)
          type: boolean
        nearestStop:
          description: Closest metro or tram stop on foot (OpenStreetMap stations; real walk from OpenRouteService once computed, estimated before), only for a precise position (street number or street); null when none within reach
          oneOf:
            - $ref: "#/components/schemas/NearestStop"
            - type: "null"
        nearestBusStop:
          description: Closest bus stop on foot (OpenFreeMap tiles, walk from OpenRouteService or estimated), once computed; no lines
          oneOf:
            - $ref: "#/components/schemas/NearestStop"
            - type: "null"
    NearestStop:
      type: object
      required: [name, lat, lng, distanceMeters, walkMinutes, lines, estimated]
      properties:
        name: { type: string }
        lat: { type: number }
        lng: { type: number }
        distanceMeters:
          description: Walking distance (OpenRouteService), or straight-line distance when estimated
          type: integer
        walkMinutes:
          description: Walk on foot (OpenRouteService), or estimate (straight line x 1.3 detour, 4.8 km/h) when estimated
          type: integer
        estimated:
          description: true = walk estimated from the straight-line distance, not routed
          type: boolean
        lines:
          type: array
          items:
            $ref: "#/components/schemas/StopLine"
    StopLine:
      type: object
      required: [mode, name, color]
      properties:
        mode: { type: string, enum: [metro, tram] }
        name: { type: string }
        color: { type: ["string", "null"] }
    HousingSearchDetail:
      allOf:
        - $ref: "#/components/schemas/HousingSearchSummary"
        - type: object
          required: [listings]
          properties:
            listings:
              type: array
              items:
                $ref: "#/components/schemas/HousingListing"
            routingAvailable:
              type: boolean
              description: Travel times can be computed (a routing key is configured)
